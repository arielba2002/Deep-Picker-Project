# OpenShift Deployment Configuration for Deep Picker Project
# This file includes all necessary components with proper network policies

# ---
# apiVersion: v1
# kind: Namespace
# metadata:
#   name: deep
#   labels:
#     name: deep

# ---
# Network Policy: Allow all traffic within the namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-namespace-traffic
  namespace: deep
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: deep
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: deep

---
# Network Policy: Allow frontend external access
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-external
  namespace: deep
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
  - Ingress
  ingress:
  - {} # Allow all ingress traffic to frontend

---
# Network Policy: Backend only accessible from frontend and within namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-policy
  namespace: deep
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
  - from:
    - namespaceSelector:
        matchLabels:
          name: deep

---
# Network Policy: Database only accessible from backend (temporarily disabled for debugging)
